apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdv-web
  namespace: mdv-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdv-web
  template:
    metadata:
      labels:
        app: mdv-web
    spec:
      initContainers:
      - name: copy-public
        image: registry.digitalocean.com/hisoft/mdv-web:latest
        command: ['sh', '-c', 'cp -r /application/public/* /mnt/public/ && cp -r /application/storage/* /mnt/storage/ && chown -R www-data:www-data /mnt/public/ /mnt/storage/ && chmod -R 755 /mnt/public/ && chmod -R 775 /mnt/storage/']
        volumeMounts:
        - name: public-volume
          mountPath: /mnt/public
        - name: storage-volume
          mountPath: /mnt/storage
      - name: migrations
        image: registry.digitalocean.com/hisoft/mdv-web:latest
        command: ['/bin/sh', '-c']
        args:
          - |
            php artisan migrate:status
            php artisan migrate --force --verbose
        workingDir: /application
        volumeMounts:
        - name: public-volume
          mountPath: /application/public
        - name: storage-volume
          mountPath: /application/storage
        env:
        - name: APP_NAME
          value: "Associação Melhor de Ver"
        - name: APP_ENV
          value: "production"
        - name: APP_KEY
          value: "base64:V76GJA3rdOBJ2Prz5tHaDaK7KmK/Adg+XanKnFbgKzE="
        - name: APP_DEBUG
          value: "false"
        - name: APP_URL
          value: "https://mdv.hisoft.com.br"
        - name: LOG_CHANNEL
          value: "daily"
        - name: LOG_DEPRECATIONS_CHANNEL
          value: "null"
        - name: LOG_LEVEL
          value: "info"
        - name: PAPERTRAIL_URL
          value: "logs3.papertrailapp.com"
        - name: PAPERTRAIL_PORT
          value: "38693"
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          value: "hisoft-prod-do-user-15994596-0.f.db.ondigitalocean.com"
        - name: DB_PORT
          value: "25060"
        - name: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
          value: "false"
        - name: DB_SSL
          value: "true"
        - name: DB_SSL_VERIFY
