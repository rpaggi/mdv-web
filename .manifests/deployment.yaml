        ports:
        - containerPort: 9000
          name: fpm
        resources:
          requests:
            memory: "64Mi"
            cpu: "0.1"
          limits:
            memory: "512Mi"
            cpu: "500m"
      
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: public-volume
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      
      volumes:
      - name: public-volume
        emptyDir: {}
      - name: storage-volume
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: mdv-web
  namespace: mdv-prod
spec:
  selector:
    app: mdv-web
  ports:
  - port: 9000
    targetPort: 9000
    name: fpm
  - port: 80
    targetPort: 80
    name: http 